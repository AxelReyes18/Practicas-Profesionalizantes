<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicio de Sesión - Centro Logístico</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <!-- LOGO DE LA EMPRESA -->
                <img src="logo.png" alt="Logo Empresa" class="login-logo">
                <h2>Centro Logístico</h2>
                <p style="font-size: 0.9rem; color: #64748b;">Acceso de Operadores y Choferes</p>
            </div>
            <form onsubmit="realizarLogin(event)">
                <div class="form-grid">
                    <div class="form-group">
                        <label>Usuario / Nombre Chofer</label>
                        <input type="text" id="loginUsuario" placeholder="ej. admin o Juan" required>
                    </div>
                    <div class="form-group">
                        <label>Contraseña</label>
                        <input type="password" id="loginPassword" placeholder="••••••••" required>
                    </div>
                    <button type="submit" class="btn-primary">Ingresar al Sistema</button>
                    <div id="loginError" class="mensaje-resultado error"></div>
                </div>
            </form>
        </div>
    </div>

    <script>
        const API_URL = 'http://localhost:3000/api';

        document.addEventListener('DOMContentLoaded', () => {
            const rol = localStorage.getItem('rol');
            if (rol === 'admin') {
                window.location.href = 'menu.html';
            } else if (rol === 'camionero') {
                window.location.href = 'camionero.html';
            }
        });

        async function realizarLogin(e) {
            e.preventDefault();
            const usuario = document.getElementById('loginUsuario').value.trim();
            const password = document.getElementById('loginPassword').value.trim();
            const msgError = document.getElementById('loginError');

            msgError.style.display = 'none';

            try {
                const res = await fetch(`${API_URL}/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ usuario, password })
                });

                const data = await res.json();

                if (!res.ok) {
                    msgError.textContent = data.error || 'Credenciales incorrectas.';
                    msgError.style.display = 'block';
                    return;
                }

                localStorage.setItem('usuario', data.usuario);
                localStorage.setItem('rol', data.rol);

                if (data.rol === 'admin') {
                    window.location.href = 'menu.html';
                } else if (data.rol === 'camionero') {
                    localStorage.setItem('camionero_id', data.camionero_id);
                    localStorage.setItem('camionero_dni', data.dni);
                    window.location.href = 'camionero.html';
                }

            } catch (err) {
                msgError.textContent = 'Error al conectar con el servidor backend.';
                msgError.style.display = 'block';
            }
        }
    </script>
</body>
</html>
